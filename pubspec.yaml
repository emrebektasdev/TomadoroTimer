name: tomadoro
description: "Tomadoro - A gamified Pomodoro focus app where time spent focusing grows a cute tomato character."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  google_sign_in: ^6.2.1
  http: ^1.2.1
  cupertino_icons: ^1.0.8
  
  # State Management (New - Riverpod)
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.4
  
  # State Management (Legacy - will be removed after migration)
  provider: ^6.1.2
  
  # Navigation
  go_router: ^14.0.0
  
  # Local Storage (New - Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Local Storage (Legacy - will be removed after migration)
  shared_preferences: ^2.3.4
  
  # Functional Programming (Either type for error handling)
  dartz: ^0.10.1
  
  # Immutable Data Classes
  freezed_annotation: ^2.4.1
  
  # Audio
  audioplayers: ^6.1.0
  
  # Charts & Statistics
  fl_chart: ^0.69.2
  
  # Date utilities
  intl: ^0.19.0
  table_calendar: ^3.1.3
  
  # UUID for unique IDs
  uuid: ^4.5.1
  flutter_secure_storage: ^10.0.0
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.8
  freezed: ^2.4.7
  riverpod_generator: ^2.3.11
  hive_generator: ^2.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/sounds/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
